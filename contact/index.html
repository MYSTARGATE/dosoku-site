<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>お問い合わせ | DOSOKU</title>
  <style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:#06111f;color:#fff}
a{color:inherit}
#loader{position:fixed;inset:0;background:radial-gradient(circle at center,#123a68 0%,#06111f 55%,#02060b 100%);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .8s ease, visibility .8s ease}
#loader.hide{opacity:0;visibility:hidden}
.loader-logo{width:150px;animation:pulse 1.8s infinite;margin-bottom:18px}
.loader-title{font-size:44px;font-weight:800;letter-spacing:4px}
.loader-sub{margin:8px 0 26px;color:#aee7ff;letter-spacing:3px}
.loader-status{margin-top:14px;color:#d8f4ff;font-size:14px;letter-spacing:2px;min-height:20px}
.bar-row{width:330px;margin:10px 0;font-size:13px;color:#d8f4ff;opacity:.35;transition:opacity .25s ease, transform .25s ease}
.bar-row.active{opacity:1;transform:translateX(4px)}
.bar-row.done{opacity:.8}
.bar{height:8px;background:#102942;border-radius:20px;overflow:hidden;margin-top:5px}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#0099ff,#00eaff);transition:width .08s linear}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 8px #00aaff)}50%{filter:drop-shadow(0 0 28px #00eaff)}}

header{min-height:92vh;background:linear-gradient(120deg,rgba(2,8,18,.95),rgba(5,38,78,.86)),radial-gradient(circle at 80% 20%,rgba(0,174,255,.35),transparent 35%);padding:32px 7vw 70px;position:relative;overflow:hidden}
nav{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:70px}
.brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:26px;letter-spacing:2px;text-decoration:none}
.brand img{width:58px}
.nav-links a{color:#dff7ff;text-decoration:none;margin-left:22px;font-size:14px}
.hero{display:grid;grid-template-columns:1fr 1.2fr;gap:50px;align-items:center}
.badge{display:inline-block;padding:8px 16px;border:1px solid #1dafff;color:#80dcff;border-radius:30px;margin-bottom:18px;font-weight:bold}
h1{font-size:clamp(42px,6vw,78px);line-height:1.15;margin:0 0 20px;letter-spacing:2px}
.lead{font-size:20px;color:#d9f6ff;line-height:1.9;margin-bottom:28px}
.hero-buttons a{display:inline-block;text-decoration:none;padding:14px 24px;border-radius:10px;margin-right:12px;font-weight:bold}
.btn-primary{background:#00aaff;color:#fff}
.btn-secondary{border:1px solid #62d6ff;color:#c9f4ff}
.hero-img{width:100%;border-radius:18px;box-shadow:0 25px 80px rgba(0,0,0,.45);border:1px solid rgba(120,220,255,.3)}

section{padding:80px 7vw;background:#f4f8fc;color:#102033}
section.dark{background:#071426;color:white}
.section-title{text-align:center;font-size:38px;margin:0 0 16px;color:#003b78}
.dark .section-title{color:#fff}
.section-sub{text-align:center;color:#5d6d7f;margin-bottom:44px;line-height:1.8}
.dark .section-sub{color:#bcecff}

.features{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:white;border-radius:16px;padding:26px;box-shadow:0 8px 25px rgba(0,35,80,.08);border:1px solid #e2edf7}
.card h3{margin:0 0 10px;color:#003b78}
.card p{line-height:1.7;color:#47586c;font-size:14px}

.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.step{background:white;padding:18px;border-radius:16px;text-align:center;border:1px solid #dbe8f5;color:#102033}
.step img{width:100%;border-radius:12px;margin-bottom:14px;box-shadow:0 8px 18px rgba(0,0,0,.16)}
.num{background:#004b9b;color:white;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;margin-bottom:12px}

.image-wide{width:100%;border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.18);margin-top:20px}

.pricing{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.price-card{background:white;border-radius:18px;padding:30px;border-top:7px solid #006de0;box-shadow:0 8px 28px rgba(0,30,70,.12)}
.price{font-size:34px;font-weight:900;color:#d90000;margin:18px 0}
.price-card ul{padding-left:20px;line-height:2;color:#334}

.pro{background:linear-gradient(120deg,#06111f,#0d315d);border:1px solid rgba(108,214,255,.25);border-radius:22px;padding:42px;text-align:center}
.pro ul{display:inline-block;text-align:left;line-height:2;font-size:18px}

footer{background:#02070d;color:#b8c8d8;padding:40px 7vw;text-align:center}
.footer-logo{width:120px;margin-bottom:10px}
.footer-links{margin-top:14px;font-size:14px}
.footer-links a{color:#dff7ff;text-decoration:none;margin:0 8px}
.footer-links a:hover{text-decoration:underline}

.page-header{min-height:auto;padding:32px 7vw 56px}
.page-header nav{margin-bottom:56px}
.page-title{max-width:980px;margin:0 auto;text-align:center}
.page-title h1{font-size:clamp(34px,5vw,58px)}
.page-main{background:#f4f8fc;color:#102033;padding:70px 7vw}
.page-box{max-width:980px;margin:0 auto;background:#fff;border-radius:18px;padding:34px;box-shadow:0 8px 25px rgba(0,35,80,.08);border:1px solid #e2edf7}
.page-box h2{color:#003b78;border-bottom:1px solid #dbe8f5;padding-bottom:10px;margin-top:30px}
.page-box h2:first-child{margin-top:0}
.page-box p,.page-box li{line-height:1.9;color:#47586c}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.form-field{margin-bottom:18px}
.form-field.full{grid-column:1/-1}
label{display:block;font-weight:700;color:#003b78;margin-bottom:8px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;font-family:inherit}
textarea{min-height:160px;resize:vertical}
button{width:100%;border:0;border-radius:12px;background:#00aaff;color:white;font-size:18px;font-weight:800;padding:15px;cursor:pointer}
.note{font-size:13px;color:#64748b;margin-top:16px}
.placeholder{background:#f8fbff;border:1px dashed #9cc8e8;border-radius:12px;padding:14px;color:#31506b}

@media(max-width:900px){
  .hero{grid-template-columns:1fr}
  .features,.steps,.pricing,.form-grid{grid-template-columns:1fr}
  nav{align-items:flex-start;flex-direction:column}
  .nav-links a{margin:0 14px 0 0;display:inline-block;margin-bottom:8px}
}
</style>
</head>
<body>
<header class="page-header">
  <nav>
    <a class="brand" href="../index.html"><img src="../images/logo-d.png" alt="DOSOKU">DOSOKU</a>
    <div class="nav-links">
      <a href="../index.html#features">機能</a>
      <a href="../index.html#steps">使い方</a>
      <a href="../index.html#pricing">料金</a>
      <a href="../terms.html">利用規約</a>
    </div>
  </nav>
  <div class="page-title">
    <span class="badge">Contact</span>
    <h1>お問い合わせ</h1>
    <p class="lead">体験版申込・見積依頼・導入相談など、DOSOKUに関するお問い合わせはこちらから。体験版はメールで個別にご案内します。</p>
  </div>
</header>

<main class="page-main">
  <div class="page-box">
    <form action="https://formspree.io/f/xaqznzrg" method="POST">
  
<input type="hidden" name="_next" value="https://dosoku.com/contact/thanks.html">
      <!-- Formspree等を利用する場合は、上記action URLを発行されたURLに差し替えてください。 -->
      <div class="form-grid">
        <div class="form-field full">
          <label for="type">お問い合わせ種別 必須</label>
          <select id="type" name="お問い合わせ種別" required>
            <option value="">選択してください</option>
            <option>体験版申込</option>
            <option>見積依頼</option>
            <option>導入相談</option>
            <option>製品について</option>
            <option>その他</option>
          </select>
        </div>
        <div class="form-field">
          <label for="company">会社名 必須</label>
          <input id="company" type="text" name="会社名" required>
        </div>
        <div class="form-field">
          <label for="department">部署名 必須</label>
          <input id="department" type="text" name="部署名" required>
        </div>
        <div class="form-field">
          <label for="name">お名前 必須</label>
          <input id="name" type="text" name="お名前" required>
        </div>
        <div class="form-field">
          <label for="kana">ふりがな 必須</label>
          <input id="kana" type="text" name="ふりがな" required>
        </div>
        <div class="form-field">
          <label for="email">メールアドレス 必須</label>
          <input id="email" type="email" name="メールアドレス" required>
        </div>
        <div class="form-field">
          <label for="tel">電話番号 必須</label>
          <input id="tel" type="tel" name="電話番号" required>
        </div>
        <div class="form-field">
          <label for="purpose">使用目的</label>
          <select id="purpose" name="使用目的">
            <option value="">選択してください</option>
            <option>土木</option>
            <option>建築</option>
            <option>外構</option>
            <option>測量</option>
            <option>その他</option>
          </select>
        </div>
        <div class="form-field">
          <label for="devices">使用予定台数</label>
          <select id="devices" name="使用予定台数">
            <option value="">選択してください</option>
            <option>1台</option>
            <option>2～5台</option>
            <option>6台以上</option>
          </select>
        </div>
        <div class="form-field full">
          <label for="source">DOSOKUを知ったきっかけ</label>
          <select id="source" name="DOSOKUを知ったきっかけ">
            <option value="">選択してください</option>
            <option>Google検索</option>
            <option>YouTube</option>
            <option>ご紹介</option>
            <option>SNS</option>
            <option>その他</option>
          </select>
        </div>
        <div class="form-field full">
          <label for="message">お問い合わせ内容 必須</label>
          <textarea id="message" name="お問い合わせ内容" placeholder="体験版をご希望の場合は、用途・図面形式・確認したい機能などをご記入ください。" required></textarea>
        </div>
      </div>
      <button type="submit">送信する</button>
      <p class="note">送信いただいた内容は、お問い合わせ対応・見積作成・製品案内・サポート対応の目的で利用します。</p>
    </form>
  </div>
</main>

<footer>
  <img src="../images/logo-d.png" class="footer-logo" alt="DOSOKU">
  <p>© MY STAR GATE / DOSOKU</p>
  <p>お問い合わせ：dosoku.info@gmail.com</p>
  <div class="footer-links">
    <a href="../terms.html">利用規約</a> |
    <a href="../privacy.html">プライバシーポリシー</a> |
    <a href="../commerce.html">特定商取引法に基づく表記</a>
  </div>
</footer>

<script>
  const params = new URLSearchParams(window.location.search);
  if (params.get("type") === "trial") {
    const type = document.getElementById("type");
    if (type) type.value = "体験版申込";
  }
</script>
</body>
</html>
