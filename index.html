<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOSOKU | 土量・測量支援システム</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:#06111f;color:#fff}
#loader{position:fixed;inset:0;background:radial-gradient(circle at center,#123a68 0%,#06111f 55%,#02060b 100%);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .5s ease, visibility .5s ease}
#loader.hide{opacity:0;visibility:hidden}
.loader-logo{width:150px;animation:pulse 1s infinite;margin-bottom:18px}
.loader-title{font-size:44px;font-weight:800;letter-spacing:4px}
.loader-sub{margin:8px 0 26px;color:#aee7ff;letter-spacing:3px}
.bar-row{width:330px;margin:10px 0;font-size:13px;color:#d8f4ff}
.bar{height:8px;background:#102942;border-radius:20px;overflow:hidden;margin-top:5px}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#0099ff,#00eaff);animation:loadbar 1s forwards}
.bar-row:nth-child(1) span{animation-delay:0s}
.bar-row:nth-child(2) span{animation-delay:.1s}
.bar-row:nth-child(3) span{animation-delay:.2s}
.bar-row:nth-child(4) span{animation-delay:.3s}
.contact-form{max-width:850px;margin:0 auto;background:white;border-radius:20px;padding:34px;box-shadow:0 14px 45px rgba(0,35,80,.12)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.form-field{display:flex;flex-direction:column;gap:8px}
.form-field.full{grid-column:1/-1}
.form-field label{font-weight:700;color:#003b78}
.form-field input,.form-field select,.form-field textarea{width:100%;padding:13px 14px;border:1px solid #cdd9e5;border-radius:10px;font-size:15px;font-family:inherit}
.form-field textarea{min-height:150px;resize:vertical}
.privacy{display:block;margin:18px 0;color:#334;line-height:1.7}
.submit-btn{width:100%;padding:16px;border:none;border-radius:12px;background:#006de0;color:white;font-size:18px;font-weight:800;cursor:pointer}
footer{background:#02070d;color:#b8c8d8;padding:40px 7vw;text-align:center}
.footer-logo{width:120px;margin-bottom:10px}
@media(max-width:900px){
  .hero{grid-template-columns:1fr}
  .features,.steps,.pricing,.form-grid{grid-template-columns:1fr}
  nav{align-items:flex-start;flex-direction:column}
  .nav-links a{margin:0 14px 0 0}
}
  </style>
</head>
<body>
<div id="loader">
  <img src="images/logo-d.png" class="loader-logo" alt="DOSOKU">
  <div class="loader-title">DOSOKU</div>
  <div class="loader-sub">土量・測量支援システム</div>
  <div class="bar-row">MY Engine<div class="bar"><span></span></div></div>
  <div class="bar-row">STAR Engine<div class="bar"><span></span></div></div>
  <div class="bar-row">GATE Engine<div class="bar"><span></span></div></div>
  <div class="bar-row">DOSOKU System<div class="bar"><span></span></div></div>
</div>
<header>
  <nav>
    <div class="brand"><img src="images/logo-d.png" alt="DOSOKU">DOSOKU</div>
    <div class="nav-links">
      <a href="#features">機能</a>
      <a href="#steps">使い方</a>
      <a href="#pricing">料金</a>
      <a href="#contact">お問い合わせ</a>
    </div>
  </nav>
  <div class="hero">
    <div>
      <span class="badge">Standard v2.0.2</span>
      <h1>図面から、<br>スマートに土量測量。</h1>
      <p class="lead">PDF・DXF・画像図面を読み込み、囲うだけで面積・体積を算出。<br>現場の測量・集計・報告書作成を、もっと簡単に。</p>
      <div class="hero-buttons">
        <a class="btn-primary" href="#contact">体験版・問い合わせ</a>
        <a class="btn-secondary" href="#steps">使い方を見る</a>
      </div>
    </div>
    <img class="hero-img" src="images/hero-main.png" alt="DOSOKU画面">
  <img class="image-wide" src="images/pamphlet-front.png" alt="DOSOKUパンフレット">
  <h2 class="section-title">お問い合わせ・体験版申込</h2>
  <p class="section-sub">体験版申込・見積依頼・導入相談はこちらからご連絡ください。</p>
  <form class="contact-form" action="https://formspree.io/f/xxxxxxxx" method="POST">
    <input type="hidden" name="_subject" value="DOSOKU公式サイトからのお問い合わせ">
<div class="form-grid">
  <div class="form-field">
    <label>会社名 必須</label>
    <input type="text" name="会社名" required>
  </div>
  <div class="form-field">
    <label>部署名 必須</label>
    <input type="text" name="部署名" required>
  </div>
  <div class="form-field">
    <label>氏名 必須</label>
    <input type="text" name="氏名" required>
  </div>
  <div class="form-field">
    <label>メールアドレス 必須</label>
    <input type="email" name="メールアドレス" required>
  </div>
  <div class="form-field">
    <label>電話番号 必須</label>
    <input type="tel" name="電話番号" required>
  </div>
  <div class="form-field">
    <label>お問い合わせ種別 必須</label>
    <select name="お問い合わせ種別" required>
      <option value="">選択してください</option>
      <option value="体験版申込">体験版申込</option>
      <option value="見積依頼">見積依頼</option>
      <option value="導入相談">導入相談</option>
      <option value="製品について">製品について</option>
      <option value="その他">その他</option>
    </select>
  </div>
  <div class="form-field full">
    <label>お問い合わせ内容</label>
    <textarea name="お問い合わせ内容" placeholder="ご相談内容をご記入ください"></textarea>
  </div>
</div>
<label class="privacy">
  <input type="checkbox" name="個人情報同意" required>
  個人情報の取扱いに同意します
</label>
<button class="submit-btn" type="submit">送信する</button>
  </form>
</section>
<footer>
  <img src="images/logo-d.png" class="footer-logo" alt="DOSOKU">
  <p>© MY STAR GATE / DOSOKU</p>
</footer>
<script>
  window.addEventListener("load", function(){
    setTimeout(function(){
      document.getElementById("loader").classList.add("hide");
    }, 1000);
  });
</script>
</body>
</html>
